name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a running workflow when a newer commit is pushed to the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Makefile uses uv to create .venv with Python 3.13
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: env/requirements*.txt

      - name: Install dependencies
        run: make venv-dev

      - name: Run all tests (including short trainings on the real dataset)
        run: make test-all

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: env/Dockerfile
          tags: inception-petroleum-analysis:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image imports the pipeline
        run: >
          docker run --rm inception-petroleum-analysis:ci
          python -c "import importlib, tensorflow as tf;
          importlib.import_module('scripts.models-calibration');
          print('TensorFlow', tf.__version__)"
