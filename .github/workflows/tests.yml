name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a running workflow when a newer commit is pushed to the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Makefile uses uv to create .venv with Python 3.13
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: env/requirements*.txt

      - name: Install dependencies
        run: make venv-dev

      - name: Run all tests (including short trainings on the real dataset)
        run: make test-all

